<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="This is a website made as a sample project for Triple Ten."/><meta name="author" content="Dylan Silver"/><meta name="keywords" content="HTML, CSS, web development, tutorials"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="d3610e9c6dce3cb370d8.svg" alt="Spot Logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><div class="profile__avatar-container"><img src="b182f164a475a255796c.jpg" alt="Bessie Coleman" class="profile__avatar"/> <button type="button" class="profile__avatar-edit-btn"><img src="76c62eed5ff7a6dbfb7a.svg" alt="Edit avatar icon" class="profile__avatar-edit-icon"/><span class="profile__avatar-edit-label">Edit Avatar</span></button></div><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-btn"><img src="e67f94af194073c6004c.svg" alt="Pencil icon"/>Edit Profile</button></div><button type="button" class="profile__add-btn"><img src="40608da7369d39bc1077.svg" alt="Plus icon"/>New Post</button></section><section class="cards page__section"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-btn" aria-label="Delete card"></button> <img class="card__image" src="#" alt=""/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-btn"></button></div></li></template></ul></section></main><footer class="footer">2023 &copy; Spots</footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><h2 class="modal__title">Edit profile</h2><button type="button" class="modal__close-btn"><img src="b6803fef330c8e48dafa.svg" alt="Close" class="close-icon"/></button><form name="edit-profile" class="modal__form" novalidate><label class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><h2 class="modal__title">New post</h2><button type="button" class="modal__close-btn"><img src="b6803fef330c8e48dafa.svg" alt="Close" class="close-icon"/></button><form name="new-post" class="modal__new-post modal__form" novalidate><label class="modal__label">Image Link <input id="new-post-link-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="new-post-link-input-error" class="modal__error"></span></label> <label class="modal__label">Caption <input id="new-post-caption-input" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="new-post-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="avatar-modal"><div class="modal__container"><h2 class="modal__title">Edit Avatar</h2><button type="button" class="modal__close-btn"><img src="b6803fef330c8e48dafa.svg" alt="Close" class="close-icon"/></button><form name="avatar" class="modal__form" id="edit-avatar-form" novalidate><label class="modal__label" for="profile-avatar-input">Avatar <input id="profile-avatar-input" type="url" class="modal__input" placeholder="Paste a link to your avatar" required/> <span id="profile-avatar-input-error" class="modal__error"></span></label> <button type="submit" class="modal__submit-btn">Save</button></form></div></div><div class="modal" id="delete-card-modal"><div class="modal__container modal__container_type_delete"><h2 class="modal__title modal__title_type_delete">Are you sure you want to delete this image?</h2><button type="button" class="modal__close-btn modal__close-btn_type_delete" aria-label="Close delete confirmation"><img src="53f0bab7ec2e970778f9.svg" alt="" class="close-icon"/></button><form name="delete-card" class="modal__form modal__form_type_delete"><button type="submit" class="modal__submit-btn modal__submit-btn_type_delete">Delete</button> <button type="button" class="modal__cancel-btn">Cancel</button></form></div></div><div class="modal" id="preview-modal"><div class="modal__image-container"><img src="#" alt="" class="modal__image"/><p class="modal__caption">Golden Gate Bridge</p><button type="button" class="modal__close-btn modal__close-btn_type_preview"><img src="53f0bab7ec2e970778f9.svg" alt="Close" class="close-icon"/></button></div></div></div></body></html>
